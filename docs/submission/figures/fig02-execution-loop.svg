<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1170" viewBox="0 0 920 1170"><title>可靠执行与用户控制闭环</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#000"/></marker></defs><rect width="100%" height="100%" fill="#fff"/>
<rect x="250" y="22" width="340" height="54" rx="27" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="420" y="49" text-anchor="middle" dominant-baseline="central" font-family="SimSun,宋体,serif" font-size="25" font-weight="400">接收用户任务</text>
<rect x="250" y="126" width="340" height="66" rx="0" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="420" y="159" text-anchor="middle" dominant-baseline="central" font-family="SimSun,宋体,serif" font-size="25" font-weight="400">观察界面并组织上下文</text>
