<text x="420" y="275" text-anchor="middle" dominant-baseline="central" font-family="SimSun,宋体,serif" font-size="25" font-weight="400">生成下一步操作</text>
<polygon points="420,366 590,424 420,482 250,424" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="420" y="424" text-anchor="middle" dominant-baseline="central" font-family="SimSun,宋体,serif" font-size="25" font-weight="400">检查执行条件</text>
<rect x="250" y="537" width="340" height="66" rx="0" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="420" y="570" text-anchor="middle" dominant-baseline="central" font-family="SimSun,宋体,serif" font-size="26" font-weight="400">执行桌面操作</text>
<rect x="250" y="682" width="340" height="66" rx="0" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="420" y="715" text-anchor="middle" dominant-baseline="central" font-family="SimSun,宋体,serif" font-size="26" font-weight="400">记录动作回执</text>
<rect x="250" y="798" width="340" height="66" rx="0" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="420" y="831" text-anchor="middle" dominant-baseline="central" font-family="SimSun,宋体,serif" font-size="25" font-weight="400">重新观察并核对结果</text>
<polygon points="420,914 590,972 420,1030 250,972" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="420" y="972" text-anchor="middle" dominant-baseline="central" font-family="SimSun,宋体,serif" font-size="25" font-weight="400">任务目标完成？</text>
<rect x="250" y="1080" width="340" height="54" rx="27" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="420" y="1107" text-anchor="middle" dominant-baseline="central" font-family="SimSun,宋体,serif" font-size="25" font-weight="400">交付任务结果</text>
<path d="M420,76 L420,126" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M420,192 L420,242" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M420,308 L420,366" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M420,482 L420,537" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M420,603 L420,682" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M420,748 L420,798" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M420,864 L420,914" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M420,1030 L420,1080" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="467.5" y="519" text-anchor="middle" dominant-baseline="central" font-family="SimSun,宋体,serif" font-size="21" font-weight="400">允许</text>
<text x="467.5" y="1054" text-anchor="middle" dominant-baseline="central" font-family="SimSun,宋体,serif" font-size="21" font-weight="400">是</text>
<rect x="20" y="380" width="170" height="88" rx="44" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="105" y="408.16" text-anchor="middle" dominant-baseline="central" font-family="SimSun,宋体,serif" font-size="24" font-weight="400">暂停执行</text>
<text x="105" y="439.84000000000003" text-anchor="middle" dominant-baseline="central" font-family="SimSun,宋体,serif" font-size="24" font-weight="400">等待调整</text>
<path d="M250,424 L190,424" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="222" y="400" text-anchor="middle" dominant-baseline="central" font-family="SimSun,宋体,serif" font-size="20" font-weight="400">不允许</text>
<rect x="680" y="380" width="220" height="88" rx="0" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="790" y="408.16" text-anchor="middle" dominant-baseline="central" font-family="SimSun,宋体,serif" font-size="24" font-weight="400">用户审批</text>
<text x="790" y="439.84000000000003" text-anchor="middle" dominant-baseline="central" font-family="SimSun,宋体,serif" font-size="24" font-weight="400">并复核执行条件</text>
<path d="M590,424 L680,424" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
