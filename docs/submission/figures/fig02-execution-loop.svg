<polygon points="790,512 900,570 790,628 680,570" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="790" y="554.82" text-anchor="middle" dominant-baseline="central" font-family="SimSun,宋体,serif" font-size="23" font-weight="400">批准且</text>
<text x="790" y="585.1800000000001" text-anchor="middle" dominant-baseline="central" font-family="SimSun,宋体,serif" font-size="23" font-weight="400">条件有效？</text>
<path d="M790,468 L790,512" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M680,570 L590,570" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="651.5" y="546" text-anchor="middle" dominant-baseline="central" font-family="SimSun,宋体,serif" font-size="20" font-weight="400">是</text>
<rect x="680" y="682" width="220" height="66" rx="33" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="790" y="715" text-anchor="middle" dominant-baseline="central" font-family="SimSun,宋体,serif" font-size="23" font-weight="400">暂停并等待调整</text>
<path d="M790,628 L790,682" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="823" y="655" text-anchor="middle" dominant-baseline="central" font-family="SimSun,宋体,serif" font-size="20" font-weight="400">否</text>
<rect x="20" y="928" width="170" height="88" rx="0" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="105" y="956.82" text-anchor="middle" dominant-baseline="central" font-family="SimSun,宋体,serif" font-size="23" font-weight="400">更新任务状态</text>
<text x="105" y="987.1800000000001" text-anchor="middle" dominant-baseline="central" font-family="SimSun,宋体,serif" font-size="23" font-weight="400">继续执行</text>
<path d="M250,972 L190,972" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="219.5" y="948" text-anchor="middle" dominant-baseline="central" font-family="SimSun,宋体,serif" font-size="20" font-weight="400">否</text>
<ellipse cx="105" cy="1083" rx="20" ry="20" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="105" y="1083" text-anchor="middle" dominant-baseline="central" font-family="SimSun,宋体,serif" font-size="24" font-weight="400">A</text>
<path d="M105,1016 L105,1063" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<ellipse cx="170" cy="159" rx="20" ry="20" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="170" y="159" text-anchor="middle" dominant-baseline="central" font-family="SimSun,宋体,serif" font-size="24" font-weight="400">A</text>
<path d="M190,159 L250,159" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="460" y="1147" text-anchor="middle" dominant-baseline="central" font-family="SimSun,宋体,serif" font-size="20" font-weight="400">注：同名连接符 A 表示流程续接；审批后仍需复核执行条件。</text>
</svg>