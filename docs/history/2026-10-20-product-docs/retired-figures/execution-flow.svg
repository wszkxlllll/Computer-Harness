<g font-size="21" font-weight="bold"><text x="149" y="120">取得当前观察</text><text x="446" y="120">编译 Context</text><text x="743" y="120">模型产生调用</text><text x="743" y="288">工具校验与准入</text><text x="446" y="288">记录开始并执行</text><text x="149" y="288">记录动作回执</text><text x="149" y="462">再观察当前界面</text><text x="446" y="462">模型核对与续行</text><text x="743" y="462">结束或等待用户</text><text x="983" y="288">用户审批</text></g>
<g font-size="16"><text x="149" y="149">截图与当前目标</text><text x="446" y="149">目标 历史 纠正 状态</text><text x="743" y="149">统一工具和参数</text><text x="743" y="319">权限 预算 风险</text><text x="446" y="319">Adapter 调用 CUA</text><text x="149" y="319">区分完成 部分 未知</text><text x="149" y="493">失效旧引用与坐标</text><text x="446" y="493">不把请求当作成果</text><text x="743" y="493">保存事实与清理资源</text><text x="983" y="319">批准后仍复查</text></g>
