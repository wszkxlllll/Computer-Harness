<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">Computer Harness可靠执行流程</title><desc id="desc">观察经Context进入模型，工具调用校验与风险准入后执行，记录回执和新观察；确认走用户审批，未知不重放。</desc>
