name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: windows-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}

      - name: Setup repository-pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
          cache: true

      - name: Record toolchain
        run: |
          node --version
          pnpm --version
          git rev-parse HEAD

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # At the audited baseline, typecheck also builds TS project references.
      - name: Typecheck and build
        run: pnpm run typecheck

      - name: Prepare test report directory
        run: |
          node -e "require('node:fs').mkdirSync('.ci-reports', { recursive: true })"

      - name: Unit and contract tests (no live desktop or model API)
        run: pnpm exec vitest run --reporter=default --reporter=junit --outputFile=.ci-reports/vitest.xml

      - name: Built CLI help smoke test
        run: node apps/cli/dist/index.js --help

      - name: Verify dependency files were not rewritten
        run: git diff --exit-code -- package.json pnpm-lock.yaml pnpm-workspace.yaml

      - name: Upload synthetic-test report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ matrix.os }}-node-${{ matrix.node }}
          path: .ci-reports/vitest.xml
          if-no-files-found: warn
          retention-days: 7

  required:
    name: ci-required
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every matrix job to pass
        shell: bash
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$VERIFY_RESULT" != "success" ]; then
            echo "Verification matrix ended with: $VERIFY_RESULT"
            exit 1
          fi
